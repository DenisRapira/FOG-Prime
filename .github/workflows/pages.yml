name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - build/test-website.cjs
      - build/package.json
      - build/package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate website before deploying
        shell: pwsh
        env:
          PLAYWRIGHT_CHANNEL: msedge
        run: |
          npm ci --prefix build --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked browser-check dependency installation failed.' }
          node build/test-website.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Website checks failed.' }
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Archive website
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-ChildItem -LiteralPath docs -Recurse -Force | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }) {
            throw 'Website archive must not contain links.'
          }
          & "$env:SystemRoot/System32/tar.exe" -cf "$env:RUNNER_TEMP/artifact.tar" -C docs .
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows website archive creation failed.' }
      - name: Upload website
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
