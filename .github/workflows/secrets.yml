name: Public source secret scan

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify scanner and inspect Git history
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          $expected = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Scanner checksum mismatch.' }
          Expand-Archive $archive -DestinationPath $destination
          & (Join-Path $destination 'gitleaks.exe') git . --log-opts='--all' --config=.gitleaks.toml --redact --no-banner
          if ($LASTEXITCODE -ne 0) { throw 'Secret scan failed. Review redacted findings privately.' }
